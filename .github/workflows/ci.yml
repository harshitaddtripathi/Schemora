name: Schemora CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Pytest & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Phase 0 Validation
        run: |
          uv run --with-requirements requirements-phase0.txt python scripts/validate_phase0.py

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        run: |
          uv sync
          uv run pytest

  flutter-analysis:
    name: Flutter Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: ./frontend
        run: flutter analyze

      - name: Run Flutter Unit Tests
        working-directory: ./frontend
        run: flutter test
